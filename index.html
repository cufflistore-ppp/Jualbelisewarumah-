<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda - JualBeliSewaRumah</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <i class="fas fa-house-chimney"></i>
      <span>JualBeliSewaRumah</span>
    </div>
    <div class="header-actions">
      <a href="login.html" id="login-link" class="btn btn-primary" style="padding:8px 16px;font-size:0.85rem;">
        <i class="fas fa-sign-in-alt"></i> Login
      </a>
    </div>
  </header>

  <div class="page-container">
    <div class="banner">
      <h1>Temukan Rumah Impianmu</h1>
      <p>Jual, beli, dan sewa rumah dengan mudah & aman</p>
    </div>

    <div class="search-section">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Cari nama rumah atau lokasi...">
      </div>

      <div class="filter-tabs">
        <button class="filter-btn active" data-status="">
          <i class="fas fa-th-large"></i> Semua
        </button>
        <button class="filter-btn" data-status="DIJUAL">
          <i class="fas fa-tag"></i> Dijual
        </button>
        <button class="filter-btn" data-status="DIKONTRAKKAN">
          <i class="fas fa-key"></i> Dikontrakkan
        </button>
      </div>

      <div class="filter-row">
        <select class="filter-select" id="location-filter">
          <option value="">Semua Lokasi</option>
        </select>
      </div>
    </div>

    <h2 class="section-title">
      <i class="fas fa-home"></i> Rumah Tersedia
    </h2>

    <div class="product-grid" id="product-grid">
      <!-- Products loaded by JS -->
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item active">
      <i class="fas fa-house"></i>
      <span>Beranda</span>
    </a>
    <a href="kontrakan.html" class="nav-item">
      <i class="fas fa-building"></i>
      <span>Kontrakan</span>
    </a>
    <a href="jual-rumah.html" class="nav-item">
      <i class="fas fa-house-chimney"></i>
      <span>Jual Rumah</span>
    </a>
    <a href="saya.html" class="nav-item">
      <i class="fas fa-user"></i>
      <span>Saya</span>
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script src="js/produk.js"></script>
  <script src="js/navigasi.js"></script>
  <script src="js/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      const loginLink = document.getElementById('login-link');
      if (user) {
        loginLink.innerHTML = `<i class="fas fa-user"></i> ${user.name.split(' ')[0]}`;
        loginLink.href = 'saya.html';
      }

      populateLocationFilter('location-filter');
      loadProducts();

      // Search
      let searchTimeout;
      document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadProducts, 300);
      });

      // Filter tabs
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadProducts();
        });
      });

      document.getElementById('location-filter').addEventListener('change', loadProducts);
    });

    function loadProducts() {
      const search = document.getElementById('search-input').value;
      const status = document.querySelector('.filter-btn.active')?.dataset.status || '';
      const location = document.getElementById('location-filter').value;

      const products = filterProducts({ search, status, location });
      renderProductGrid(products, 'product-grid');
    }
  </script>
</body>
</html>
