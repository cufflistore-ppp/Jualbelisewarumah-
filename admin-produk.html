<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Produk - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <button class="admin-menu-toggle" id="admin-menu-toggle">
    <i class="fas fa-bars"></i>
  </button>

  <aside class="admin-sidebar">
    <div class="admin-logo">
      <i class="fas fa-house-chimney"></i>
      <span>Admin Panel</span>
    </div>
    <ul class="admin-nav">
      <li><a href="admin-index.html"><i class="fas fa-chart-line"></i> Dashboard</a></li>
      <li><a href="admin-pengguna.html"><i class="fas fa-users"></i> Pengguna</a></li>
      <li><a href="admin-produk.html" class="active"><i class="fas fa-home"></i> Produk</a></li>
      <li><a href="admin-paket.html"><i class="fas fa-box"></i> Kelola Paket</a></li>
      <li><a href="../index.html"><i class="fas fa-globe"></i> Ke Website</a></li>
      <li><a href="#" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Keluar</a></li>
    </ul>
  </aside>

  <main class="admin-main">
    <div class="admin-header">
      <h1>Kelola Produk</h1>
    </div>

    <div class="admin-search">
      <input type="text" id="search-products" placeholder="Cari judul atau lokasi...">
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>Produk</th>
            <th>Status</th>
            <th>Harga</th>
            <th>Pemilik</th>
            <th>Aktif</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="products-tbody"></tbody>
      </table>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      requireAdmin();
      initAdminSidebar();
      loadProductsTable();
      document.getElementById('search-products').addEventListener('input', loadProductsTable);
    });
  </script>
</body>
</html>
