<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - JualBeliSewaRumah</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <i class="fas fa-house-chimney"></i>
    </div>
    <h1>JualBeliSewaRumah</h1>
    <p class="subtitle">Marketplace jual & sewa rumah terpercaya</p>

    <button class="login-btn google" id="btn-google">
      <i class="fab fa-google"></i>
      Login dengan Google
    </button>

    <button class="login-btn facebook" id="btn-facebook">
      <i class="fab fa-facebook-f"></i>
      Login dengan Facebook
    </button>

    <p class="login-note">
      Dengan login, Anda menyetujui ketentuan penggunaan JualBeliSewaRumah.<br>
      Akun baru otomatis dibuat saat pertama kali login.
    </p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
