<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontrakan - JualBeliSewaRumah</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <i class="fas fa-house-chimney"></i>
      <span>JualBeliSewaRumah</span>
    </div>
  </header>

  <div class="page-container">
    <div class="banner" style="background: linear-gradient(135deg, #7c3aed, #ec4899);">
      <h1><i class="fas fa-key"></i> Kontrakan</h1>
      <p>Temukan rumah kontrak terbaik untuk Anda</p>
    </div>

    <div class="search-section">
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="search-input" placeholder="Cari nama atau lokasi kontrakan...">
      </div>
      <div class="filter-row">
        <select class="filter-select" id="location-filter">
          <option value="">Semua Lokasi</option>
        </select>
        <input type="number" class="filter-select" id="max-price" placeholder="Harga max (Rp)">
      </div>
    </div>

    <h2 class="section-title">
      <i class="fas fa-building"></i> Rumah Dikontrakkan
    </h2>

    <div class="product-grid" id="product-grid"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-house"></i>
      <span>Beranda</span>
    </a>
    <a href="kontrakan.html" class="nav-item active">
      <i class="fas fa-building"></i>
      <span>Kontrakan</span>
    </a>
    <a href="jual-rumah.html" class="nav-item">
      <i class="fas fa-house-chimney"></i>
      <span>Jual Rumah</span>
    </a>
    <a href="saya.html" class="nav-item">
      <i class="fas fa-user"></i>
      <span>Saya</span>
    </a>
  </nav>

  <script src="js/auth.js"></script>
  <script src="js/produk.js"></script>
  <script src="js/navigasi.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      populateLocationFilter('location-filter');
      loadProducts();

      let t;
      document.getElementById('search-input').addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(loadProducts, 300);
      });
      document.getElementById('location-filter').addEventListener('change', loadProducts);
      document.getElementById('max-price').addEventListener('input', () => {
        clearTimeout(t);
        t = setTimeout(loadProducts, 400);
      });
    });

    function loadProducts() {
      const products = filterProducts({
        status: 'DIKONTRAKKAN',
        search: document.getElementById('search-input').value,
        location: document.getElementById('location-filter').value,
        maxPrice: document.getElementById('max-price').value
      });
      renderProductGrid(products, 'product-grid');
    }
  </script>
</body>
</html>
