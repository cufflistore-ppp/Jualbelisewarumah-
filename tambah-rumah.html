<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tambah Rumah - JualBeliSewaRumah</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="header">
    <button class="back-btn" onclick="location.href='saya.html'">
      <i class="fas fa-arrow-left"></i>
    </button>
    <div class="logo">
      <i class="fas fa-plus-circle"></i>
      <span>Tambah Rumah</span>
    </div>
    <div style="width:40px;"></div>
  </header>

  <div class="page-container" style="padding:16px;">
    <div id="form-container">
      <div class="alert alert-info">
        <i class="fas fa-info-circle"></i>
        <div>
          <span id="slot-info">Produk: -/ -</span><br>
          Upload minimal <strong>5 foto</strong> rumah.
        </div>
      </div>

      <form id="form-tambah">
        <!-- Photos -->
        <div class="form-group">
          <label>Foto Rumah <span class="required">*</span> (min. 5)</label>
          <div class="photo-upload-area" id="photo-upload-area">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Klik atau drag foto ke sini</p>
            <p style="font-size:0.8rem;color:var(--gray);">JPG, PNG (max 10 foto)</p>
          </div>
          <input type="file" id="photo-input" accept="image/*" multiple style="display:none;">
          <div class="photo-preview-grid" id="photo-preview-grid"></div>
          <div class="photo-count" id="photo-count">0 foto dipilih (minimal 5)</div>
        </div>

        <!-- Video (package 3 only) -->
        <div class="form-group hidden" id="video-group">
          <label>Video Rumah (opsional)</label>
          <input type="file" id="video-input" accept="video/*" class="form-control">
          <div id="video-preview" class="mt-1"></div>
        </div>

        <div class="form-group">
          <label>Nama / Judul Rumah <span class="required">*</span></label>
          <input type="text" id="title" class="form-control" placeholder="Contoh: Rumah Modern Minimalis Type 70" required>
        </div>

        <div class="form-group">
          <label>Status <span class="required">*</span></label>
          <select id="status" class="form-control" required>
            <option value="">Pilih status</option>
            <option value="DIJUAL">DIJUAL</option>
            <option value="DIKONTRAKKAN">DIKONTRAKKAN</option>
          </select>
        </div>

        <div class="form-group">
          <label>Harga (Rp) <span class="required">*</span></label>
          <input type="number" id="price" class="form-control" placeholder="Contoh: 850000000" required min="0">
          <small style="color:var(--gray);font-size:0.8rem;">Untuk kontrak, isi harga per tahun</small>
        </div>

        <div class="form-group">
          <label>Alamat Lengkap <span class="required">*</span></label>
          <textarea id="address" class="form-control" placeholder="Jl. Contoh No. 1, Kelurahan, Kecamatan, Kota" required></textarea>
        </div>

        <div class="form-group">
          <label>Lokasi Singkat (untuk kartu)</label>
          <input type="text" id="locationShort" class="form-control" placeholder="Contoh: Jakarta Selatan">
        </div>

        <div class="form-group">
          <label>Deskripsi</label>
          <textarea id="description" class="form-control" placeholder="Deskripsikan rumah Anda..."></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Kamar Tidur</label>
            <input type="number" id="bedrooms" class="form-control" min="0" placeholder="3">
          </div>
          <div class="form-group">
            <label>Kamar Mandi</label>
            <input type="number" id="bathrooms" class="form-control" min="0" placeholder="2">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Luas Tanah (m²)</label>
            <input type="number" id="landArea" class="form-control" min="0" placeholder="120">
          </div>
          <div class="form-group">
            <label>Luas Bangunan (m²)</label>
            <input type="number" id="buildingArea" class="form-control" min="0" placeholder="90">
          </div>
        </div>

        <div class="form-group">
          <label>Fasilitas</label>
          <input type="text" id="facilities" class="form-control" placeholder="Carport, Taman, AC, Kitchen Set (pisahkan koma)">
        </div>

        <div class="form-group">
          <label>Nomor WhatsApp <span class="required">*</span></label>
          <input type="tel" id="whatsapp" class="form-control" placeholder="081234567890" required>
          <small style="color:var(--gray);font-size:0.8rem;">Akan digunakan untuk tombol Hubungi Pemilik</small>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          <i class="fas fa-save"></i> Simpan Rumah
        </button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/tambah-rumah.js"></script>
</body>
</html>
